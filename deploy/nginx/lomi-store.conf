# Lomi Store behind Cloudflare (DNS record, orange cloud, SSL mode "Full (strict)").
# Before using it, replace bot.yourdomain.com and 3500 (your APP_PORT). Steps: docs/DEPLOY.md, Part 4.
#
# Cloudflare -> nginx (port 443, Cloudflare Origin Certificate) -> app on 127.0.0.1:APP_PORT

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bot.yourdomain.com;

    ssl_certificate     /etc/ssl/cloudflare/lomi-store.pem;
    ssl_certificate_key /etc/ssl/cloudflare/lomi-store.key;

    client_max_body_size 5m;

    # Live dashboard WebSocket: needs the Upgrade headers and a long timeout.
    location /ws/ {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
