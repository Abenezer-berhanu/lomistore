# Lomi Store on one server: app + PostgreSQL + Redis + Cloudflare Tunnel.
# Start:   docker compose up -d --build
# Logs:    docker compose logs -f web

# A unique project name keeps these containers and volumes apart from other projects on the server.
name: lomi_store

services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://lomi:${POSTGRES_PASSWORD}@db:5432/lomi
      REDIS_URL: redis://redis:6379/0
    # Only reachable from the server itself (for health checks). The public reaches it through the tunnel.
    ports:
      - "127.0.0.1:${APP_PORT}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lomi
      POSTGRES_USER: lomi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lomi -d lomi"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # Outbound-only connection to Cloudflare: no open ports, no changes to other projects' web servers.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web

volumes:
  postgres_data:
